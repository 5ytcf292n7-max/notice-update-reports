name: Daily Notice Report

on:
  schedule:
    - cron: "20 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate report
        run: python scripts/check_notices.py

      - name: Commit report
        run: |
          git config user.name "notice-update-bot"
          git config user.email "notice-update-bot@users.noreply.github.com"
          git add reports data/state.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily notice report"
            git push
          fi

